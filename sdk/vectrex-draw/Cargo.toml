# The draw layer SHARED by both cartridges.
#
# It exists so there is ONE implementation of the beam model. There used to be two: one in
# Rust, inside a cartridge firmware, and one in C, inside the .um2 image. Duplicating them
# guarantees every discovery has to be made twice — the BIOS's `Recalibrate` had to be
# transcribed literally, twice, on the same day.
#
# It builds TWO ways from the same source:
#   rlib      -> linked by the firmware, as a normal dependency
#   staticlib -> libvectrex_draw.a, which CMake puts into the .um2 image
#
# The cartridge firmware is NOT touched: the .um2 is still a self-contained image that its
# menu loads; it just links this instead of carrying its own draw layer.
#
# INDEPENDENT of any surrounding workspace. Without this, cargo takes it for a member of the
# root workspace and refuses to build it ("believes it's in a workspace when it's not"). It
# is a bare-metal crate with its own target; it has no reason to share a profile or a
# lockfile with host tooling.
[workspace]

[package]
name = "vectrex-draw"
version = "0.1.0"
edition = "2021"

[lib]
# rlib ONLY. The C wrapper and the panic handler live in `cabi/`, because a staticlib
# DEMANDS a handler and that collides with the firmware's own one when it links the rlib.
# Splitting them is what lets both boards use the same model.
crate-type = ["rlib"]

[profile.release]
# No unwinding: there is nobody to propagate a panic to inside a bare-metal image, and the
# unwinding scaffolding drags in symbols the C link cannot resolve.
panic = "abort"
opt-level = "s"
